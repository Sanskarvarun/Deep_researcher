[project]
name = "deepresearcher"
version = "0.1.0"
description = "Production-grade RAG agent with agentic capabilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "python-json-logger>=2.0",
    # LLM & Orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.1.0",
    "langchain-google-genai>=2.0",  # Gemini (primary LLM + embeddings)
    "langchain-openai>=0.2",        # OpenRouter (OpenAI-compatible)
    "langchain-huggingface>=0.1.0",
    "langchain-qdrant>=0.1.0",
    "langchain-community>=0.3.0",
    # Vector DB & Embeddings
    "qdrant-client>=1.10",
    "sentence-transformers>=3.0",
    # Reranking
    "cohere>=4.0",
    # Document Processing
    "pypdf>=4.0",
    "markdown-it-py>=3.0",
    "beautifulsoup4>=4.12",
    "youtube-transcript-api>=0.6",
    # Evaluation (optional - requires C++ build tools on Windows)
    # "ragas>=0.2.0",
    # API Framework
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "requests>=2.32",
    # Caching & Queue
    "redis>=5.0",
    "celery>=5.4",
    # Frontend
    "streamlit>=1.37",
    # Utilities
    "tenacity>=8.2",
    "structlog>=24.1",
    "rich>=13.7",
    "typer>=0.12",
    "arize-phoenix-otel>=0.17.3",
    "ragas==0.2.15",
    "datasets>=5.1.0",
    "langchain-google-vertexai>=3.2.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pre-commit>=3.7",
]
local = [
    "flagembedding>=1.2",  # For local reranking
    "torch>=2.3",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepresearcher"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "PTH", "RUF", "SIM", "TID", "PYI",
]
ignore = []
fixable = ["ALL"]
unfixable = []
per-file-ignores = {}
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "PTH", "RUF", "SIM", "TID", "PYI"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
enable_error_code = ["ignore-without-code"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
